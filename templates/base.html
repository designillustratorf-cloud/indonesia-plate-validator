<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Plate Validator Indonesia
        {% endblock %}
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <!-- Theme Initialization Script (Prevents FOUC) -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold text-gradient" href="{{ url_for('home') }}">
                <i class="bi bi-shield-check"></i> PlateValidator
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link"
                            href="{{ url_for('home') }}">
                            Home
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="{{ url_for('simulator') }}">
                            Simulator DFA
                        </a>

                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="{{ url_for('about') }}">
                            About
                        </a>
                    </li>
                    <li class="nav-item d-flex align-items-center">
                        <button id="themeToggle" class="btn p-1 ms-lg-3" style="border: none; background: transparent; font-size: 1.3rem; color: var(--text-primary);">
                            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                        </button>
                    </li>
                </ul>

            </div>

        </div>

    </nav>

    <!-- Content -->
    <main class="container main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->

    <footer class="bg-dark text-white text-center py-3 mt-5">

        <div class="container">

            <small>

                © 2026 Plate Validator Indonesia

                <br>

                Universitas Bale Bandung

                <br>

                Teknik Informatika

            </small>

        </div>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Script -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
